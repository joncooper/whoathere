[package]
name = "whoathere-macos-vm"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
sha2 = { version = "=0.11.0", default-features = false }
whoathere-artifact = { path = "../whoathere-artifact" }
whoathere-detonation = { path = "../whoathere-detonation" }
zeroize = "=1.9.0"

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["miniz_oxide"] }
tar = { version = "0.4.46", default-features = false }
whoathere-evidence = { path = "../whoathere-evidence" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
