[package]
name = "whoathere-artifact-review-ollama"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "whoathere-ollama-artifact-review-adapter"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
whoathere-artifact = { path = "../whoathere-artifact" }
whoathere-detector = { path = "../whoathere-detector" }

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["miniz_oxide"] }
tar = { version = "0.4.46", default-features = false }
whoathere-evidence = { path = "../whoathere-evidence" }
