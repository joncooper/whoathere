[package]
name = "whoathere-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "=1.0.150"
whoathere-core = { path = "../whoathere-core" }
whoathere-admission = { path = "../whoathere-admission" }
whoathere-audit = { path = "../whoathere-audit" }
whoathere-artifact = { path = "../whoathere-artifact" }
whoathere-cache = { path = "../whoathere-cache" }
whoathere-detector = { path = "../whoathere-detector" }
whoathere-evidence = { path = "../whoathere-evidence" }
whoathere-hash = { path = "../whoathere-hash" }
whoathere-launch = { path = "../whoathere-launch" }
whoathere-macos-vm = { path = "../whoathere-macos-vm" }
whoathere-policy = { path = "../whoathere-policy" }
whoathere-runner = { path = "../whoathere-runner" }
whoathere-sandbox = { path = "../whoathere-sandbox" }
whoathere-source = { path = "../whoathere-source" }
whoathere-vault-api = { path = "../whoathere-vault-api" }
whoathere-vault-dev = { path = "../whoathere-vault-dev" }

[[bin]]
name = "whoathere"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["miniz_oxide"] }
tar = { version = "0.4.46", default-features = false }
