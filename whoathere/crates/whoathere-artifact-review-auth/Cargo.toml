[package]
name = "whoathere-artifact-review-auth"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
rust-version = "1.85"

[[bin]]
name = "whoathere-auth-inert-artifact-review-provider"
path = "../whoathere-artifact-review-runtime/src/bin/inert_provider.rs"

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
libc = "0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
whoathere-artifact = { path = "../whoathere-artifact" }
whoathere-artifact-review-runtime = { path = "../whoathere-artifact-review-runtime" }
whoathere-detector = { path = "../whoathere-detector" }
whoathere-evidence = { path = "../whoathere-evidence" }
zeroize = "=1.9.0"

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["miniz_oxide"] }
tar = { version = "0.4.46", default-features = false }
