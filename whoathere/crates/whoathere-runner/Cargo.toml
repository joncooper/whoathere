[package]
name = "whoathere-runner"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
libc = "=0.2.186"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
whoathere-artifact = { path = "../whoathere-artifact" }
whoathere-artifact-review-runtime = { path = "../whoathere-artifact-review-runtime" }
whoathere-cache = { path = "../whoathere-cache" }
whoathere-detector = { path = "../whoathere-detector" }
whoathere-detonation = { path = "../whoathere-detonation" }
whoathere-evidence = { path = "../whoathere-evidence" }

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["miniz_oxide"] }
tar = { version = "0.4.46", default-features = false }
whoathere-hash = { path = "../whoathere-hash" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
