[package]
name = "whoathere-detonation"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
whoathere-artifact = { path = "../whoathere-artifact" }
whoathere-evidence = { path = "../whoathere-evidence" }
whoathere-hash = { path = "../whoathere-hash" }
whoathere-vault-api = { path = "../whoathere-vault-api" }

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["miniz_oxide"] }
tar = { version = "0.4.46", default-features = false }
