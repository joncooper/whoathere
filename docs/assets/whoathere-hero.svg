    <circle cx="1310" cy="103" r="2" fill="#5eead4"/>
    <circle cx="1229" cy="346" r="3" fill="#7dd3fc"/>
    <circle cx="680" cy="54" r="2.5" fill="#5eead4"/>
  </g>
</svg>
