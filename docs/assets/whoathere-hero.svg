<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">WhoaThere</title>
  <desc id="desc">Package supply-chain security: inspect, isolate, observe, and admit.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="0.55" stop-color="#102839"/>
      <stop offset="1" stop-color="#17223c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8d477"/>
      <stop offset="1" stop-color="#f59e7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9bd8d1" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1400" height="420" rx="28" fill="url(#background)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="1135" cy="210" rx="350" ry="310" fill="url(#glow)"/>
  <path d="M0 345 C230 280 380 390 630 322 C825 268 1030 248 1400 325 L1400 420 L0 420 Z" fill="#07131f" opacity="0.48"/>

  <g transform="translate(88 80)">
    <rect x="0" y="0" width="58" height="5" rx="2.5" fill="url(#warm)"/>
    <text x="0" y="72" fill="#f7fbfc" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="3">WHOA</text>
    <text x="0" y="138" fill="url(#accent)" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="3">THERE</text>
    <text x="3" y="187" fill="#c7d9df" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500">Package installs are executable code.</text>
    <text x="3" y="225" fill="#8faab5" font-family="Helvetica, Arial, sans-serif" font-size="17" letter-spacing="1.5">INSPECT  ·  ISOLATE  ·  OBSERVE  ·  ADMIT</text>
  </g>

  <g transform="translate(735 62)">
    <path d="M84 93 L171 43 L258 93 L258 193 L171 243 L84 193 Z" fill="#0d202d" stroke="#5eead4" stroke-width="2"/>
