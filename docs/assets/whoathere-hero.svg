    <path d="M124 70 L171 97 L218 70 L171 43 Z" fill="#5eead4" fill-opacity="0.12"/>
    <circle cx="171" cy="143" r="43" fill="#102f3a" stroke="#7dd3fc" stroke-width="2"/>
    <path d="M171 111 C185 122 200 124 200 124 V151 C200 172 186 187 171 193 C156 187 142 172 142 151 V124 C142 124 157 122 171 111 Z" fill="url(#accent)"/>
    <path d="M156 151 L167 162 L187 139" fill="none" stroke="#0a1b27" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(0 277)">
      <rect x="0" y="0" width="112" height="42" rx="21" fill="#f8d477" fill-opacity="0.13" stroke="#f8d477" stroke-opacity="0.7"/>
      <text x="56" y="27" text-anchor="middle" fill="#f8e2a5" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">PACKAGE</text>
      <path d="M120 21 H147" stroke="#718e99" stroke-width="2"/>
      <path d="M141 15 L149 21 L141 27" fill="none" stroke="#718e99" stroke-width="2"/>

      <rect x="158" y="0" width="112" height="42" rx="21" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.75"/>
      <text x="214" y="27" text-anchor="middle" fill="#a7f3e8" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">EVIDENCE</text>
      <path d="M278 21 H305" stroke="#718e99" stroke-width="2"/>
      <path d="M299 15 L307 21 L299 27" fill="none" stroke="#718e99" stroke-width="2"/>

      <rect x="316" y="0" width="112" height="42" rx="21" fill="#7dd3fc" fill-opacity="0.12" stroke="#7dd3fc" stroke-opacity="0.75"/>
      <text x="372" y="27" text-anchor="middle" fill="#bae6fd" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600">VERDICT</text>
